# =============================================================================
# "CHAOS SWEEP v2" - No Limits Bayesian Hyperparameter Exploration
# =============================================================================
#
# Strategy: Explore the entire theoretical surface from "Deterministic AE"
# to "Chaotic Physics Simulator". Wide logarithmic ranges to find stable
# islands that conservative defaults would never touch.
#
# KEY: Uses val_mse (unscaled) as metric for cross-run comparability,
# allowing recon_scale to be swept without breaking optimization.
#
# Expected: 30-40% failures (NaNs, divergence, collapse) - this is normal.
# Goal: Find the "unicorn" configuration that beats all baselines.
#
# Usage:
#   wandb sweep conf/sweep/chaos_sweep_v2.yaml
#   wandb agent <entity>/<project>/<sweep_id>
#
# =============================================================================

program: scripts/wandb_sweep_agent.py
method: bayes
name: rlvae-chaos-sweep-v2

# Maximum number of runs for this sweep (set to desired total)
# With ~20 parameters, 400-500 runs is recommended for good coverage
run_cap: 500

# CRITICAL: Use unscaled MSE for comparability across recon_scale values!
metric:
  name: val_mse
  goal: minimize

# Aggressive early termination for obviously bad runs
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 2

# =============================================================================
# PARAMETERS - THE FULL CHAOS SPECTRUM (EXPANDED)
# =============================================================================
parameters:

  # =========================================================================
  # 1. GEOMETRY (Metric Sharpness)
  # =========================================================================
  
  # Temperature: 0.5 = sharp/jagged geometry, 5.0 = smooth/Euclidean-like
  temperature_override:
    values: [0.5, 0.8, 1.0, 1.5, 2.0, 3.0, 5.0]
  
  # Background identity strength: how much fallback to Euclidean
  bg_strength:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
    
  # Eigenvalue floor: lower = sharper metric, but riskier
  eig_floor_abs:
    values: [0.01, 0.05, 0.1, 0.2]

  # =========================================================================
  # 2. PRECISION (Alpha - Sampling Variance)
  # =========================================================================
  
  # Alpha: From "Dirac Delta at μ" (0.001) to "Super-Inflation" (2.0)
  # Low = encoder has full control, High = massive exploration cloud
  rhmc_alpha:
    distribution: log_uniform_values
    min: 0.001
    max: 2.0
    
  # Covariance regularization: critical when alpha is tiny
  rhmc_eps_reg:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
    
  # Minimum covariance eigenvalue: floor to prevent singularity
  min_cov_eig:
    distribution: log_uniform_values
    min: 0.001
    max: 0.05

  # =========================================================================
  # 3. DYNAMICS (RHMC Trajectory)
  # =========================================================================
  
  # Step size: "Micro-steps" (1e-5) to "Leaps" (0.02)
  rhmc_step_size:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.02
    
  # Steps: 0 = no RHMC, up to 8 for "Deep Transport"
  rhmc_steps:
    values: [0, 1, 3, 5, 8]

  # =========================================================================
  # 4. CAPACITY (Flow Architecture)
  # =========================================================================
  
  # Number of flow transformations (added 13)
  n_flows:
    values: [5, 7, 9, 11, 13]
    
  # Flow output clipping: expanded range
  flow_output_clip:
    distribution: uniform
    min: 3.0
    max: 15.0
    
  # Flow regularization weight: expanded upper bound
  flow_weight:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.5
    
  # Flow loss mode: different regularization strategies
  flow_loss_mode:
    values: ["relu", "l2", "abs", "none"]

  # =========================================================================
  # 5. OPTIMIZER (Learning Rate & Stability)
  # =========================================================================
  
  # Learning rate: massive range from ultra-conservative to aggressive
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.005
    
  # Gradient clipping: crucial safety net for high LR
  gradient_clip_val:
    values: [0.1, 0.5, 1.0, 5.0]

  # =========================================================================
  # 6. LOSS BALANCE (The Triangle of Forces)
  # =========================================================================
  
  # Beta: KL weight - expanded to 2.0
  # Low (1e-4) = "Reconstruct at all costs"
  # High (2.0) = "Heavily respect the prior"
  beta:
    distribution: log_uniform_values
    min: 0.0001
    max: 2.0
    
  # Reconstruction scale: multiplier for recon loss
  # IMPORTANT: val_mse metric is unscaled, so these are comparable!
  recon_scale:
    values: [1.0, 10.0, 100.0, 255.0]

  # =========================================================================
  # 7. VOLUME/PRIOR (Riemannian Prior Weighting)
  # =========================================================================
  
  # Volume bias weight: how much prior volume matters
  volume_bias_weight:
    distribution: uniform
    min: 0.1
    max: 2.5
    
  # Volume gradient scale: scaling for volume gradients
  volume_grad_scale:
    distribution: uniform
    min: 0.3
    max: 2.0

  # =========================================================================
  # 8. ENCODER REGULARIZATION (Explicit Guidance)
  # =========================================================================
  
  # L2 on encoder means: anchors μ, prevents drift
  mu_l2_weight:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
    
  # Centroid attraction: pulls μ toward learned centroids
  # If this wins big, Clustering > Transport!
  mu_centroid_weight:
    distribution: log_uniform_values
    min: 0.00001
    max: 1.0

# =============================================================================
# Run configuration
# =============================================================================
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
