# @package sweep

# Comprehensive Hyperparameter Sweep for RLVAE Pipeline
# =====================================================
# This sweep optimizes all major hyperparameters across both stages
# of the pipeline to minimize total validation error

name: "rlvae_comprehensive_hyperparameter_sweep"
description: "Comprehensive optimization of RLVAE pipeline hyperparameters"

# Sweep method
method: random  # random, grid, bayes

# Optimization objective 
metric:
  name: "val_loss"  # Primary metric to optimize
  goal: minimize

# Early termination for inefficient runs
early_terminate:
  type: hyperband
  max_iter: 50
  eta: 3
  s: 2

# Resource constraints
run_cap: 100  # Maximum number of runs
max_runs: 100
concurrent_runs: 4

# Parameters to sweep
parameters:
  # === STAGE 1 (Vanilla VAE) PARAMETERS ===
  stage1_architecture:
    values: ["mlp", "cnn", "resnet"]
  
  stage1_latent_dim:
    values: [8, 16, 32, 64]
  
  stage1_epochs:
    distribution: int_uniform
    min: 25
    max: 100
  
  stage1_temperature:
    distribution: log_uniform_values
    min: 0.1
    max: 2.0
  
  stage1_regularization:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  
  stage1_preset:
    values: ["balanced", "conservative", "max_diversity"]
  
  # === STAGE 2 (RLVAE) PARAMETERS ===
  # Model architecture
  n_flows:
    values: [4, 6, 8, 12, 16]
  
  beta:
    distribution: log_uniform_values
    min: 0.5
    max: 5.0
  
  riemannian_beta:
    distribution: log_uniform_values
    min: 1.0
    max: 20.0
  
  flow_hidden_size:
    values: [128, 256, 512]
  
  flow_n_blocks:
    values: [2, 3, 4]
  
  sampling_method:
    values: ["geodesic", "enhanced", "standard"]
  
  loop_mode:
    values: ["open", "closed"]
  
  loop_penalty:
    distribution: log_uniform_values
    min: 0.1
    max: 10.0
  
  # === TRAINING PARAMETERS ===
  max_epochs:
    distribution: int_uniform
    min: 30
    max: 100
  
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001
  
  batch_size:
    values: [8, 16, 32, 64]
  
  # === DATA PARAMETERS ===
  # Training data size (percentage of available data)
  n_train_samples:
    values: [500, 1000, 2000, 3000, 5000]
  
  n_val_samples:
    values: [200, 400, 600, 888]  # 888 is max available
  
  # === REGULARIZATION PARAMETERS ===
  posterior_type:
    values: ["gaussian", "riemannian_metric"]
  
  # Temperature override for metric
  temperature_override:
    distribution: log_uniform_values
    min: 0.5
    max: 5.0

# Fixed parameters (for reproducibility and performance)
parameters_fixed:
  # Reproducibility
  seed: 42
  
  # Performance settings
  training.trainer.precision: "16-mixed"
  training.trainer.devices: 1
  training.data.num_workers: 4
  
  # Visualization (minimal for speed during sweeps)
  visualization: "end_only"
  
  # Logging
  wandb.mode: "online"
  wandb.project: "rlvae-hyperparameter-optimization"

# Command template for sweep runs
command:
  - python
  - run_experiment.py
  - experiment=global_vanilla_rlvae_pipeline
  - hydra.mode=RUN  # Single run mode (not multirun)
  - ${args}

# Evaluation strategy
evaluation:
  # Quick training for hyperparameter search
  quick_mode: true
  
  # Primary metrics to track
  primary_metrics:
    - "val_loss"
    - "val_recon_loss" 
    - "val_kl_loss"
    - "train_loss"
  
  # Secondary metrics for analysis
  secondary_metrics:
    - "cyclicity_error"
    - "riemannian_kl"
    - "metric_conditioning" 