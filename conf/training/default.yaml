# @package training

# Default training configuration
defaults:
  - _self_

# Training parameters
trainer:
  max_epochs: 100
  accelerator: "gpu"
  devices: 1  # Use single GPU to avoid device mismatches
  strategy: "auto"  # Use auto strategy for single GPU
  precision: "16-mixed"
  log_every_n_steps: 10
  val_check_interval: 1.0
  num_sanity_val_steps: 2
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  use_distributed_sampler: false  # Disable for single GPU
  gradient_clip_val: 1.0  # FIX: Add gradient clipping for stability

# Data parameters
data:
  batch_size: 16
  num_workers: 4
  pin_memory: true

# Model parameters
model:
  latent_dim: 32
  beta: 1.0
  riemannian_beta: 0.1
  posterior:
    type: "riemannian_metric"
  sampling:
    method: "enhanced"
    use_riemannian: true
  loop:
    mode: "closed"
    penalty: 0.1

# Optimization
optimizer:
  name: "adam"
  lr: 0.0005  # Reduced learning rate for stability
  weight_decay: 0.0001

# Logging
logging:
  log_every_n_steps: 10
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"
  # Stage C throttles
  stage_c_metric_viz_every_n_epochs: 5
  metric_snapshot_every_n_epochs: 5

# Visualization
visualization:
  frequency: 10
  level: "standard"

# Data splits
data_splits:
  train: 0.7
  val: 0.15
  test: 0.15

# Scheduler
scheduler:
  mode: "min"
  factor: 0.5
  patience: 10
  min_lr: 1e-7

# Early stopping
early_stopping:
  patience: 20
  monitor: "val_loss"
  mode: "min" 

# Alternating metric update schedule (disabled by default)
metric_alternation:
  enabled: false         # set true to enable alternating schedule
  warmup_epochs: 5       # freeze metric for first N epochs
  k_rlvae_epochs: 3      # epochs updating theta, phi, flows with metric frozen
  metric_step_epochs: 1  # epochs updating metric only (others frozen)
  anchor_size: 20000     # number of anchor points A in S
  anchor_refresh_frac: 0.1  # refresh 10% of anchors per metric epoch
  logdet_clip: 50.0      # clamp for numerical stability
  consistency_weight: 0.0  # optional pushforward consistency penalty weight