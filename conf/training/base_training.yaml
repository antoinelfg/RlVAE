# @package training

# Base training configuration
defaults:
  - _self_

# Training parameters
trainer:
  max_epochs: 50
  accelerator: "gpu"
  devices: 1
  strategy: "auto"
  precision: "16-mixed"
  log_every_n_steps: 10
  val_check_interval: 1.0
  num_sanity_val_steps: 2
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  use_distributed_sampler: false

# Data parameters
data:
  batch_size: 64
  num_workers: 8
  pin_memory: true

# Model parameters
model:
  latent_dim: 16
  beta: 1.0

# Optimization
optimizer:
  name: "adam"
  lr: 0.0001
  weight_decay: 0.0001

# Logging
logging:
  log_every_n_steps: 10
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"

# Visualization
visualization:
  frequency: 10
  level: "standard"

# Data splits
data_splits:
  train: 0.7
  val: 0.15
  test: 0.15

# Scheduler
scheduler:
  mode: "min"
  factor: 0.5
  patience: 10
  min_lr: 1e-7

# Early stopping
early_stopping:
  patience: 20
  monitor: "val_loss"
  mode: "min" 