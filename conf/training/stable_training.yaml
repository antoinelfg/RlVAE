# Stable Training Configuration
# This configuration focuses on training stability with:
# - Gradient clipping
# - Adaptive learning rate scheduling
# - Loss monitoring and early stopping
# - Proper optimizer settings

_target_: src.training.lightning_trainer.LightningRlVAETrainer

# Trainer settings
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 50
  gradient_clip_val: 1.0  # Gradient clipping for stability
  accumulate_grad_batches: 1
  precision: 16  # Use mixed precision for efficiency
  deterministic: false
  benchmark: true
  
  # Logging settings
  log_every_n_steps: 10
  val_check_interval: 0.25  # Validate every 25% of epoch
  
  # Callbacks
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      filename: "epoch_{epoch:02d}-val_loss_{val_loss:.4f}"
      
    - _target_: pytorch_lightning.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 10
      min_delta: 0.001
      
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
      
    - _target_: pytorch_lightning.callbacks.ModelSummary
      max_depth: 2

# Optimizer settings
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 5
  min_lr: 1e-6
  verbose: true

# Loss monitoring
loss_monitoring:
  enabled: true
  smoothing_factor: 0.9  # Exponential moving average
  clip_threshold: 10.0  # Clip extreme loss values
  
# Enhanced KL monitoring
enhanced_kl_monitoring:
  enabled: true
  log_beta_evolution: true
  log_alignment_penalties: true
  log_metric_coverage: true
  
# Visualization settings
visualization:
  level: intermediate
  frequency: 50  # Every 50 steps
  save_to_wandb: true
  save_locally: false
  
# Debug settings
debug:
  enabled: false
  log_gradients: false
  log_activations: false

