# @package training

# Vanilla VAE training configuration - 16D latent space, 30 epochs
defaults:
  - _self_

# Training parameters
trainer:
  max_epochs: 50  # More epochs for larger dataset
  accelerator: "gpu"
  devices: 1  # Use single GPU to avoid device mismatches
  strategy: "auto"  # Use auto strategy for single GPU
  precision: "16-mixed"
  log_every_n_steps: 10
  val_check_interval: 1.0
  num_sanity_val_steps: 2
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  use_distributed_sampler: false  # Disable for single GPU

# Data parameters
data:
  batch_size: 64  # Larger batch size for more data
  num_workers: 8  # More workers for faster data loading
  pin_memory: true
  # Use all available data (24,000 points)
  train_split: 0.9  # Use 90% for training
  val_split: 0.1    # Use 10% for validation

# Model parameters (overriding vanilla_vae.yaml)
model:
  latent_dim: 16  # Ensure 16D latent space
  beta: 1.0
  riemannian_beta: 0.0  # No Riemannian for vanilla VAE
  posterior:
    type: "gaussian"  # Standard Gaussian posterior
  sampling:
    method: "standard"  # Standard reparameterization
    use_riemannian: false
  loop:
    mode: "open"  # Standard VAE doesn't handle loops
    penalty: 0.0

# Optimization
optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0001

# Logging
logging:
  log_every_n_steps: 10
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"

# Visualization
visualization:
  frequency: 5  # More frequent visualization for 30 epochs
  level: "standard"

# Data splits
data_splits:
  train: 0.7
  val: 0.15
  test: 0.15

# Scheduler
scheduler:
  mode: "min"
  factor: 0.5
  patience: 10
  min_lr: 1e-7

# Early stopping
early_stopping:
  patience: 15  # Shorter patience for 30 epochs
  monitor: "val_loss"
  mode: "min"

# Experiment name for WandB
experiment_name: "vanilla_vae_16d_30epochs" 