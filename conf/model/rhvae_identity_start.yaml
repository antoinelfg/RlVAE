_target_: src.models.riemannian_flow_vae.RiemannianFlowVAE

# Model parameters
input_dim: 
  - ${data.channels}
  - ${data.image_size[0]}
  - ${data.image_size[1]}
latent_dim: 16
n_flows: 7
eps_lf: 2e-05
beta_zero: 1.0
temperature: 0.7
regularization: 0.001
reconstruction_loss_type: mse

# Encoder/Decoder architecture
encoder:
  _target_: src.models.components.encoder.Encoder_VAE_MLP
  input_dim: 
  - ${data.channels}
  - ${data.image_size[0]}
  - ${data.image_size[1]}
  latent_dim: 16
  hidden_dims: [512, 512, 512]
  activation: ReLU

decoder:
  _target_: src.models.components.decoder.Decoder_AE_MLP
  input_dim: 
  - ${data.channels}
  - ${data.image_size[0]}
  - ${data.image_size[1]}
  latent_dim: 16
  hidden_dims: [512, 512, 512]
  activation: ReLU

# Metric parameters - start with identity
align_with_knn_cov: False
knn_k: 300
alpha_align: 0.5
metric_normalization: none
weight_kernel: isotropic
weight_metric_normalization: trace
normalize_weight_sum: False
topk_weights: null
reestimate_metric_from_decoder_jacobian: False
jacobian_alpha: 0.5
jacobian_h: 0.001
jacobian_stride: 4
metric_scale: 1.0
realign_centroids: False
centroid_realign_method: kmeans
max_centroids: null
centroid_subsample_method: fps

# No pretrained components - start fresh
pretrained:
  encoder_path: null
  decoder_path: null
  metric_path: null

# Start with identity metric
metric:
  fixed_metric_path: null
  init_from_fixed: False
  start_with_identity: True  # New parameter to start with identity

# Posterior and flows
posterior:
  type: riemannian_metric

# Flow parameters
riemannian_kl_mode: sample_logq_logp
riemannian_beta: 1.0
flow_hidden_size: 256
flow_n_blocks: 2
flow_n_hidden: 1
epsilon: 1e-06
beta: 1.0

# Loop parameters
loop:
  mode: open
  penalty: 0.0

# Sampling parameters
sampling:
  method: geodesic
  use_riemannian: True

# Reconstruction mode
reconstruction_mode: all
encode_all_timesteps_if_no_flows: true
kl_over_all_timesteps_if_flows: false

# Metric update parameters
update_metric_during_training: true
metric_update_frequency: 30
metric_update_alpha: 0.01
metric_update_temperature: 0.7
metric_update_regularization: 0.001
