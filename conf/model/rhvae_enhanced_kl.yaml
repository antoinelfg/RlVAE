# Enhanced KL Model Configuration
# This model uses the enhanced Riemannian KL mechanism with:
# - Proper metric loading from pretrained paths
# - Adaptive beta ramping for stability
# - Metric alignment penalties
# - Improved posterior sampling

_target_: src.models.riemannian_flow_vae.RiemannianFlowVAE

# Basic model parameters
input_dim: [64, 64, 3]
latent_dim: 16
n_flows: 4
flow_type: "planar"
flow_hidden_dims: [64, 64]

# KL divergence parameters
beta: 1.0
riemannian_beta: 1.0

# Posterior configuration
posterior_type: "riemannian_metric"
riemannian_kl_mode: "sample_logq_logp"

# Metric parameters
temperature: 0.1
lbd: 0.01
n_centroids: 50

# Enhanced KL parameters
adaptive_kl_enabled: true
adaptive_kl_ramp_up_steps: 20
adaptive_kl_alignment_weight: 0.15

# Metric update parameters (disabled for stability)
update_metric_during_training: false
metric_update_frequency: 100
metric_update_alpha: 0.01
metric_update_temperature: 0.1
metric_update_regularization: 0.01

# Loop configuration
loop_lambda: 0.1

# Device configuration
device: auto

# Pretrained components (from recent successful RHVAE runs)
pretrained:
  encoder_path: data/pretrained/encoder_diverse_mlp_ld16_20250822_143848.pt
  decoder_path: data/pretrained/decoder_diverse_mlp_ld16_20250822_143848.pt
  metric_path: outputs/stages/B_PRECISION_MLP_16_SPRITES/metric_diverse_mlp_ld16_20250819_152221.pt

# Metric configuration
metric:
  temperature_override: 0.1
  regularization_override: 0.01
  start_with_identity: false  # Use pretrained metric instead
