  decoder_path: /home/alaforgu/scratch/longitudinal_experiments/RlVAE/data/pretrained/decoder_diverse_mlp_ld16_20250813_143256.pt
  metric_path: /home/alaforgu/scratch/longitudinal_experiments/RlVAE/data/pretrained/metric_diverse_mlp_ld16_20250813_143259.pt
