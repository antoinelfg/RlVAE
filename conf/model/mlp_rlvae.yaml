# @package model

_target_: rlvae.models.modular_rlvae.ModularRiemannianFlowVAE

input_dim: [3, 64, 64]
latent_dim: 16
n_flows: 8
flow_hidden_size: 256
flow_n_blocks: 2
flow_n_hidden: 1
epsilon: 1e-6

encoder:
  architecture: "mlp"
  hidden_dims: [1024, 512, 256]
  dropout: 0.1

decoder:
  architecture: "mlp"
  hidden_dims: [256, 512, 1024]
  dropout: 0.1

beta: 1.0
riemannian_beta: 8.0
riemannian_kl_mode: sample_logq_logp

posterior:
  type: "riemannian_metric"

sampling:
  method: "geodesic"
  use_riemannian: true

loop:
  mode: "open"
  penalty: 5.0

metric:
  # path: "metric_T0.7_scaled.pt"  # Only needed for fixed metric
  temperature_override: 3.0
  trainable: false  # Set to true to use a trainable metric
  architecture: "mlp"  # Options: "mlp", "resnet", "transformer"
  arch_kwargs: {}
  # To initialize the trainable metric from a fixed metric, set:
  init_from_fixed: false  # Set to true to pretrain from fixed metric
  fixed_metric_path: "data/pretrained/vanilla_metric.pt"  # Path to fixed metric file
  # Example for resnet:
  # architecture: "resnet"
  # arch_kwargs:
  #   hidden_dim: 128
  #   n_blocks: 4
  # Example for transformer:
  # architecture: "transformer"
  # arch_kwargs:
  #   hidden_dim: 128
  #   n_heads: 4
  #   n_layers: 3
  # Regularization options for trainable metric
  metric_reg_weight: 0.0  # Set >0 to enable regularization
  metric_reg_type: 'none'  # Options: 'none', 'determinant', 'condition', 'smoothness'
  metric_reg_target: 0.0   # Target value for regularization (e.g., logdet or condition number)
  # Example for determinant regularization:
  # metric_reg_weight: 1.0
  # metric_reg_type: 'determinant'
  # metric_reg_target: 0.0  # Target logdet (e.g., 0 for unit volume)
  # Example for condition number regularization:
  # metric_reg_weight: 1.0
  # metric_reg_type: 'condition'
  # metric_reg_target: 10.0  # Target condition number
  # Example for smoothness regularization:
  # metric_reg_weight: 1.0
  # metric_reg_type: 'smoothness'

pretrained:
  encoder_path: data/pretrained/encoder_diverse_mlp_ld16_20250717_134643.pt
  decoder_path: data/pretrained/decoder_diverse_mlp_ld16_20250717_134643.pt
  metric_path: data/pretrained/metric_diverse_mlp_ld16_20250717_134647.pt

visualization:
  level: advanced
  enable_interactive: true
  max_sequences: 100
  interactive_frequency: 1
  basic_frequency: 1
  manifold_frequency: 1
  flow_frequency: 1 
