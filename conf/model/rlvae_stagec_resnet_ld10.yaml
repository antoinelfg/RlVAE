# @package model

_target_: rlvae.models.modular_rlvae.ModularRiemannianFlowVAE

# Architecture
input_dim: [3, 64, 64]
latent_dim: 10
n_flows: 0
flow_hidden_size: 256
flow_n_blocks: 2
flow_n_hidden: 1
epsilon: 1e-6

# Encoder configuration - ResNet
encoder:
  architecture: cnn

# Decoder configuration - ResNet
decoder:
  architecture: cnn

# VAE parameters
beta: 0.0
riemannian_beta: 0.005
riemannian_kl_mode: sample_logq_logp

# Posterior configuration
posterior:
  type: riem_hmc

# Sampling configuration
sampling:
  method: geodesic
  use_riemannian: true

# Loop configuration
loop:
  mode: open
  penalty: 5.0

# Metric configuration
metric:
  # IMPORTANT: do not override Stage A temperature; use metric payload value
  temperature_override: null
  # Slight conditioning to avoid KL explosions
  regularization_override: 0.1

# Pretrained components (Stage A artifacts)
pretrained:
  encoder_path: outputs/stageA/rhvae_encoder.pt
  decoder_path: outputs/stageA/rhvae_decoder.pt
  metric_path: outputs/metrics/metric_t0.7.pt
