# @package model

_target_: rlvae.models.modular_rlvae.ModularRiemannianFlowVAE

# Architecture
input_dim: 
  - ${data.channels}
  - ${data.image_size[0]}
  - ${data.image_size[1]}
latent_dim: 16
n_flows: 7  # sequence_length - 1 (will be overridden by experiment)
flow_hidden_size: 256
flow_n_blocks: 2
flow_n_hidden: 1
epsilon: 1e-6

# Encoder configuration
encoder:
  architecture: "mlp"  # mlp, cnn, resnet
  # Additional encoder-specific parameters can be added here
  # For CNN: layers, channels, kernel_size, etc.
  # For ResNet: layers, channels, etc.

# Decoder configuration  
decoder:
  architecture: "mlp"  # mlp, cnn, resnet
  # Additional decoder-specific parameters can be added here
  # For CNN: layers, channels, kernel_size, etc.
  # For ResNet: layers, channels, etc.

# VAE parameters
beta: 1.0
riemannian_beta: 16.0

# Posterior configuration
posterior:
  type: "riemannian_rhmc"  # gaussian, iaf, riemannian_metric, riemannian_rhmc
  rhmc_steps: 2
  rhmc_step_size: 0.01
  rhmc_alpha: 0.10
  rhmc_eps_reg: 1e-4
  max_momentum_norm: 3.0
  max_velocity_norm: 1.0
  max_position_step: 0.5
  # Avoid shell artifacts in RHMC posterior; 0 disables clamp.
  max_position_norm: 0.0
  
# Sampling configuration
sampling:
  method: "posterior_hmc"  # posterior_hmc uses the RHMC posterior path
  use_riemannian: true
  
# Loop configuration
loop:
  mode: "open"  # open, closed
  penalty: 5.0
  
# Metric configuration
metric:
  path: "metric_T0.7_scaled.pt"
  temperature_override: 3.0
  
# KL settings
kl_metric_eval_point: "mu"
kl_use_metric_normalization: false
kl_metric_norm_mode: "none"
mu_l2_weight: 0.1
  
# Pretrained components
pretrained:
  encoder_path: "data/pretrained/encoder.pt"
  decoder_path: "data/pretrained/decoder.pt"
  metric_path: "data/pretrained/${model.metric.path}" 
