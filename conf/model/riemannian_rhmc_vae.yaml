# @package model

# Riemannian RHMC VAE configuration
# Extends the standard riemannian_flow_vae with RHMC posterior

defaults:
  - riemannian_flow_vae

# Override posterior configuration
posterior:
  type: "riemannian_rhmc"  # New posterior type
  
  # RHMC-specific parameters
  rhmc_steps: 4              # Number of RHMC leapfrog steps
  rhmc_step_size: 0.02       # Step size for leapfrog
  rhmc_alpha: 0.20           # Scaling for initial Riemannian sampling
  rhmc_eps_reg: 1e-4         # Regularization for numerical stability (new key)
  eps_regularization: 1e-6   # Legacy compatibility key
  
  # Safety bounds to prevent divergence (NEW - critical!)
  max_momentum_norm: 5.0     # Clip momentum magnitude
  max_velocity_norm: 2.0     # Clip velocity magnitude
  max_position_step: 1.0     # Bound position update size
  # Disable absolute position-norm clamping to avoid ring-shaped posterior.
  # Set >0 to re-enable with a hard radius if ever needed.
  max_position_norm: 0.0
  
  # Legacy parameters (kept for compatibility)
  max_grad_norm: 2.0         # Maximum gradient norm (legacy)
  min_step_size: 1e-4        # Minimum allowed step size (legacy)
  step_clip_scale: 2.5       # Clamp posterior steps to this scale (legacy)
  maha_clip: 3.0             # Mahalanobis distance trust region (legacy)
  cov_norm_mode: "geomean"   # Normalize covariance for sampling (legacy)

# Use standard riemannian_beta  
riemannian_beta: 8        # Optimized value for better μ alignment
rhmc_kl_mode: mc
rhmc_kl_source: z0
rhmc_kl_jacobian: false

rhmc_steps: 4
rhmc_step_size: 0.02
rhmc_alpha: 0.20
rhmc_eps_reg: 1e-4

# Posterior alpha settings (FIXED α for stability)
# Ensure both metric-aware and RHMC samplers use the same α
posterior_local_alpha: 0.5
posterior_alpha_ramp_enabled: false

# Keep other settings from base config
# (latent_dim, n_flows, etc. will be inherited or overridden by experiment)
