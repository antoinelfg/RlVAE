# @package _global_

# MLP RlVAE with Manifold Sampling Configuration
# =============================================
# Enhanced MLP RlVAE configuration with native G⁻¹ and manifold sampling

defaults:
  - mlp_rlvae

model:
  _target_: rlvae.models.modular_rlvae.ModularRiemannianFlowVAE
  
  # Core model parameters
  input_dim: [12288]  # 3*64*64 for MLP (flattened)
  latent_dim: 16
  n_flows: 8
  
  # Flow parameters
  flow_hidden_size: 256
  flow_n_blocks: 2
  flow_n_hidden: 1
  epsilon: 1e-6
  
  # Loss parameters
  beta: 1.0
  riemannian_beta: 8.0
  
  # Architecture configuration
  encoder:
    architecture: "mlp"
    hidden_dims: [1024, 512, 256]
    dropout: 0.1
    activation: "relu"
    batch_norm: true
  
  decoder:
    architecture: "mlp"
    hidden_dims: [256, 512, 1024]
    dropout: 0.1
    activation: "relu"
    batch_norm: true
  
  # Posterior configuration
  posterior:
    type: "riemannian_metric"
  
  # Sampling configuration
  sampling:
    method: "geodesic"
    use_riemannian: true
  
  # Loop configuration
  loop:
    mode: "open"
    penalty: 5.0
  
  # Metric configuration
  metric:
    temperature_override: 3.0
    metric_reg_weight: 0.0
  
  # **Manifold Sampling Configuration**
  manifold_sampling:
    enabled: true
    method: "combined"
    
    # Step size parameters
    step_size_base: 0.25
    step_size_guided: 0.25
    step_size_exploration: 0.2
    step_size_connections: 0.18
    
    # Exploration parameters
    exploration_ratio: 0.6
    direction_change_frequency: 3
    random_component_scale: 0.1
    
    # Sampling bounds
    bounds:
      min: -5.0
      max: 5.0
    
    # Combined method sampling counts
    combined:
      n_guided_paths: 20
      guided_path_length: 30
      n_explorations: 30
      exploration_length: 35
      n_connections: 15
      connection_steps: 25
    
    # Visualization parameters
    visualization:
      enabled: true
      determinant_grid_resolution: 100
      include_level_lines: true
      include_density_plot: true
      save_plots: true
    
    # WandB logging
    wandb:
      log_samples: true
      log_visualizations: true
      log_frequency: 5  # Every 5 epochs during training
    
    # **Native G⁻¹ Configuration**
    native_g_inverse:
      use_native: true  # Enable native G⁻¹ implementation
      temperature: 2.0
      regularization: 1e-4
