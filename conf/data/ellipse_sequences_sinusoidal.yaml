defaults:
  - ellipse_sequences

name: ellipse_sequences_sinusoidal
num_sequences: 1000
seq_len: 8
sequence_length: 8
image_size: [64, 64]

# DoF = 2 at t=0: vary only eccentricity (e0) and orientation (theta0)
min_radius: 18
max_radius: 18
center_jitter: 0
outline_only: false
outline_width: 2
schedule_type: sinusoidal
sinusoidal_amplitude_range: [0.25, 0.60]
sinusoidal_phase_range: [0.0, 6.283185307179586]
sinusoidal_cycle: false
sinusoidal_frequency: 1.0
fix_center: true
fix_theta: false   # orientation varies (second DoF)
fix_intensity: true
keep_major_axis_constant: true
keep_area_constant: false
batch_size: 64

# Pre-generated dataset paths (used by some utilities and overlays)
train_path: outputs/data/ellipse_sinusoidal_train.pt
val_path: outputs/data/ellipse_sinusoidal_val.pt
test_path: outputs/data/ellipse_sinusoidal_test.pt
