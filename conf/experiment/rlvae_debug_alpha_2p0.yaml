# Alpha sweep: α = 2.0 (larger)
name: rlvae_debug_alpha_2p0
description: "Alpha sweep: α=2.0. Expands covariance to help samples reach farther regions."

model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.12
    rhmc_alpha: 2.0  # Larger alpha - wider exploration
    rhmc_eps_reg: 1.0e-3
    sigma_normalization_mode: 'none'
    initial_target_radius: 0.0
    # Vanilla: no selection bias
    volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
    initial_n_candidates: 1
    initial_volume_tolerance: 0.0
    initial_max_retries: 0

stage_c:
  epochs: 5

wandb:
  project: rlvae-alpha-sweep
  run_name_template: ALPHA_2p0_{data.name}_ld{model.latent_dim}
  tags:
  - alpha_sweep
  - alpha_2p0
  - spatial_mismatch_test

