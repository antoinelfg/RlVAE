defaults:
- rlvae_three_stage_pipeline
type: three_stage
name: rlvae_three_stage_long_rhmc_modular
description: Long training with Modular RLVAE and riemannian_rhmc posterior (200 epochs
  A&C)
stage_a:
  model: vanilla_vae
  epochs: 200
  batch_size: 64
  lr: 1e-4
  beta: 1.0
  architecture: mlp
  latent_dim: 2
stage_b:
  implementation: rhvae
  n_centroids: 300
  temperature: 0.7
  regularization: 0.01
  centroid_method: kmedoids
  neighbor_mode: global
  knn_k: 300
stage_c:
  model: modular_rlvae
  epochs: 200
  batch_size: 64
  lr: 2e-4
  riemannian_beta: 1.0
  allow_metric_updates: false
  force_rhvae_components: false
  update_metric_during_training: false
  sampling:
    method: posterior_hmc
  kl_metric_eval_point: z
  kl_use_metric_normalization: false
  kl_metric_norm_mode: none
  mu_l2_weight: 0.
  kl_prior_mode: uniform
  volume_bias_weight: 1.0
  volume_grad_scale: 1.0
  latent_dim: 2
  component_validation:
    validate_encoder_compatibility: true
    validate_decoder_compatibility: true
    validate_metric_compatibility: true
    strict_loading: false
  modular_config:
    use_enhanced_loading: true
    validate_components: true
    fallback_to_original: true
model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.12  # Raised above runtime defaults
    rhmc_alpha: 0.1  # Small alpha to scale down G⁻¹ while preserving anisotropy
    rhmc_eps_reg: 1.0e-3  # Increased from 3e-6 to stabilize
    soft_position_norm: 5.5
    kinetic_grad_enabled: false
    kinetic_grad_weight: 1.0
    projection_step_scale: 0.05
    initial_max_norm: 1.5
    eps_regularization: 1e-6
    max_momentum_norm: 3.0
    max_velocity_norm: 2.5     # Raised above runtime defaults
    max_position_step: 1.2     # Raised above runtime defaults
    # Disable absolute position clamp to avoid ring artifacts
    max_position_norm: 0.0
    volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
    # FIX: Disable normalizations that were causing negative KL
    sigma_normalization_mode: 'none'  # Disable geomean normalization
    initial_target_radius: 0.0        # Disable target radius adjustment
  metric:
    trainable: false
    init_from_fixed: true
    temperature_override: null
  # Disable mu alignment to prevent normalization issues
  mu_alignment_enabled: false
  posterior_type: riemannian_rhmc
  rhmc_steps: 4
  rhmc_step_size: 0.12  # Raised above runtime defaults
  rhmc_alpha: 5.0  # Increased from 3.0
  rhmc_eps_reg: 1.0e-3  # Increased from 3e-6
  soft_position_norm: 5.5
  kinetic_grad_enabled: true
  kinetic_grad_weight: 1.0
  projection_step_scale: 0.05
  initial_max_norm: 1.5
  kl_use_metric_normalization: false
  kl_metric_norm_mode: none
  use_curvature_correction: true
  kl_metric_eval_point: z
  mu_l2_weight: 0.
  kl_prior_mode: uniform
  volume_bias_weight: 1.0
  volume_grad_scale: 1.0
  volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
  sampling:
    method: posterior_hmc
  pretrained:
    encoder_path: null
    decoder_path: null
    metric_path: null
training:
  model:
    latent_dim: 2
    posterior:
      type: riemannian_rhmc
      rhmc_steps: 4
      rhmc_step_size: 0.12  # Raised above runtime defaults
      rhmc_alpha: 0.1  # Small alpha to scale down G⁻¹ while preserving anisotropy
      rhmc_eps_reg: 1.0e-3  # Increased from 3e-6
      # FIX: PRESERVE anisotropy - no normalization
      sigma_normalization_mode: 'none'
      initial_target_radius: 0.0
    posterior_type: riemannian_rhmc
    kl_metric_eval_point: z
    kl_use_metric_normalization: false
    kl_metric_norm_mode: none
    mu_l2_weight: 0.
    kl_prior_mode: uniform
visualization:
  level: three_stage_optimized
wandb:
  project: rlvae-rhmc-comparison-long
  run_name_template: RHMC_MOD_200ep_{experiment.name}_{data.name}_ld{model.latent_dim}
  tags:
  - long_training
  - rhmc_posterior
  - 200_epochs
  - modular_rlvae
initialization:
  track_phases: true
  log_component_loading: true
  validate_consistency: true
