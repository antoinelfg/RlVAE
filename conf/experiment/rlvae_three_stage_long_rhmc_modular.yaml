defaults:
- rlvae_three_stage_pipeline
type: three_stage
name: rlvae_three_stage_long_rhmc_modular
description: Long training with Modular RLVAE and riemannian_rhmc posterior (200 epochs
  A&C)
stage_a:
  model: vanilla_vae
  epochs: 200
  batch_size: 64
  lr: 1e-4
  beta: 1.0
  architecture: mlp
  latent_dim: 2
stage_b:
  implementation: rhvae
  n_centroids: 300
  temperature: 0.7
  regularization: 0.01
  centroid_method: kmedoids
  neighbor_mode: global
  knn_k: 300
stage_c:
  model: modular_rlvae
  epochs: 200
  batch_size: 64
  lr: 2e-4
  riemannian_beta: 8.0
  allow_metric_updates: false
  force_rhvae_components: false
  update_metric_during_training: false
  sampling:
    method: posterior_hmc
  kl_metric_eval_point: z
  kl_use_metric_normalization: false
  kl_metric_norm_mode: none
  mu_l2_weight: 0.5
  kl_prior_mode: uniform
  latent_dim: 2
  component_validation:
    validate_encoder_compatibility: true
    validate_decoder_compatibility: true
    validate_metric_compatibility: true
    strict_loading: false
  modular_config:
    use_enhanced_loading: true
    validate_components: true
    fallback_to_original: true
model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.02
    rhmc_alpha: 0.2
    rhmc_eps_reg: 1e-4
    eps_regularization: 1e-6
    max_momentum_norm: 3.0
    max_velocity_norm: 1.0
    max_position_step: 0.5
    # Disable absolute position clamp to avoid ring artifacts
    max_position_norm: 0.0
  metric:
    trainable: false
    init_from_fixed: true
    temperature_override: null
  # Disable mu alignment to prevent normalization issues
  mu_alignment_enabled: false
  posterior_type: riemannian_rhmc
  rhmc_steps: 4
  rhmc_step_size: 0.02
  rhmc_alpha: 0.2
  rhmc_eps_reg: 1e-4
  kl_use_metric_normalization: false
  kl_metric_norm_mode: none
  use_curvature_correction: true
  kl_metric_eval_point: z
  mu_l2_weight: 0.5
  kl_prior_mode: uniform
  sampling:
    method: posterior_hmc
  pretrained:
    encoder_path: null
    decoder_path: null
    metric_path: null
training:
  model:
    latent_dim: 2
    posterior:
      type: riemannian_rhmc
      rhmc_steps: 4
      rhmc_step_size: 0.02
      rhmc_alpha: 0.2
      rhmc_eps_reg: 1e-4
    posterior_type: riemannian_rhmc
    kl_metric_eval_point: z
    kl_use_metric_normalization: false
    kl_metric_norm_mode: none
    mu_l2_weight: 0.5
    kl_prior_mode: uniform
visualization:
  level: three_stage_optimized
wandb:
  project: rlvae-rhmc-comparison-long
  run_name_template: RHMC_MOD_200ep_{experiment.name}_{data.name}_ld{model.latent_dim}
  tags:
  - long_training
  - rhmc_posterior
  - 200_epochs
  - modular_rlvae
initialization:
  track_phases: true
  log_component_loading: true
  validate_consistency: true
