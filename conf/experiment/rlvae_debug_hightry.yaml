# Standalone debug config - High K test (K=20, volume acceptance ON)
name: rlvae_debug_hightry
description: "DEBUG High K: K=20 (high multi-try), volume acceptance ON. Tests if bias scales with K."

# Override posterior sampling parameters
model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.12
    rhmc_alpha: 0.1
    rhmc_eps_reg: 1.0e-3
    sigma_normalization_mode: 'none'
    initial_target_radius: 0.0
    # High K test: K=20 with volume acceptance
    volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
    initial_n_candidates: 20
    initial_volume_tolerance: 0.05
    initial_max_retries: 3

stage_c:
  epochs: 5

wandb:
  project: rlvae-z0-investigation
  run_name_template: DEBUG_HIGHTRY_K20_VOL_{data.name}_ld{model.latent_dim}
  tags:
  - z0_investigation
  - high_k_test
  - multi_try_on
  - volume_acc_on
  - k20

