# Standalone debug config – Gaussian baseline without RHMC dynamics
name: rlvae_debug_gaussian
description: "DEBUG Gaussian: RHMC disabled (rhmc_steps=0). Pure N(mu, Sigma) sampling to audit posterior bias."

model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 0          # disable RHMC leapfrog updates
    rhmc_step_size: 0.0    # ignored when steps=0
    rhmc_alpha: 1.0
    rhmc_eps_reg: 1.0e-4
    sigma_normalization_mode: 'none'
    initial_target_radius: 0.0
    volume_force_sign: 1.0
    initial_n_candidates: 1
    initial_volume_tolerance: 0.0
    initial_max_retries: 0

stage_c:
  epochs: 5
  posterior:
    rhmc_steps: 0
    rhmc_step_size: 0.0
    rhmc_alpha: 1.0
    max_position_norm: 0.0
    max_position_step: 1.0
    max_velocity_norm: 2.0
    initial_n_candidates: 1
    initial_volume_tolerance: 0.0
    initial_max_retries: 0

training:
  stage_overrides:
    stage_c:
      epochs: 5
      posterior:
        rhmc_steps: 0
        rhmc_step_size: 0.0
        rhmc_alpha: 1.0
        max_position_norm: 0.0
        max_position_step: 1.0
        max_velocity_norm: 2.0
        initial_n_candidates: 1
        initial_volume_tolerance: 0.0
        initial_max_retries: 0

wandb:
  project: rlvae-z0-investigation
  run_name_template: DEBUG_GAUSSIAN_NO_RHMC_{data.name}_ld{model.latent_dim}
  tags:
    - z0_investigation
    - gaussian_baseline
    - rhmc_disabled
