# @package experiment

type: single
name: rlvae_stagec_only

description: "Run only Stage C training with pretrained metric+enc/dec from Stage A"

run_stage_a: false
run_stage_b: false
run_sampling: false
run_stage_c: true

stage_c:
  model: riemannian_flow_vae
  epochs: 1
  batch_size: 32
  riemannian_beta: ${model.riemannian_beta}
  allow_metric_updates: false

# Disable evaluation for stability in sanity runs
evaluation:
  enabled: false
