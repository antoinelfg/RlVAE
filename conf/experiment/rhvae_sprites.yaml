# @package _global_

defaults:
  - _self_

# Experiment configuration
experiment:
  type: "single"
  name: "rhvae_sprites"
  group: "rhvae_experiments"
  tags: ["rhvae", "sprites", "longitudinal"]

# Data configuration
data:
  train_path: "data/processed/Sprites_train_cyclic.pt"
  test_path: "data/processed/Sprites_test_cyclic.pt"
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Model configuration
model:
  _target_: src.models.rhvae_experiment.RHVAEExperiment
  
  # RHVAE specific parameters
  input_dim: [3, 64, 64]
  latent_dim: 16
  n_lf: 5
  eps_lf: 0.0001
  beta_zero: 0.3
  temperature: 1.5
  regularization: 0.003
  # Metric weighting kernel
  weight_kernel: isotropic
  weight_metric_normalization: trace
  normalize_weight_sum: false
  topk_weights: null
  metric_scale: 1.0
  realign_centroids: false
  centroid_realign_method: kmeans
  # Metric post-processing to avoid over-smoothing
  max_centroids: null   # e.g., 64 to cap K after training
  centroid_subsample_method: fps  # fps|kmeans
  
  # Encoder/Decoder architecture
  encoder:
    architecture: "resnet"
    hidden_dims: [64, 128, 256, 512]
    dropout: 0.1
    
  decoder:
    architecture: "resnet"
    hidden_dims: [512, 256, 128, 64]
    dropout: 0.1

# Training configuration
training:
  epochs: 100
  learning_rate: 1e-4
  weight_decay: 1e-5
  scheduler:
    type: "cosine"
    warmup_epochs: 10
    
  # Checkpointing
  save_every: 10
  save_best: true
  
  # Early stopping
  early_stopping:
    patience: 20
    min_delta: 1e-4

# Logging configuration
logging:
  wandb:
    project: "rlvae_experiments"
    entity: null  # Set your wandb username here
    log_model: true
    log_artifacts: true
    
  # Visualization settings
  visualization:
    level: "intermediate"  # minimal, intermediate, full
    log_reconstructions: true
    log_metric_evolution: true
    log_heatmaps: true
    log_clusters: true
    log_manifold: true
    
  # Logging frequency
  log_every: 10  # steps
  log_epoch_every: 1
  log_visualizations_every: 5  # epochs

# Evaluation configuration
evaluation:
  metrics:
    - "reconstruction_loss"
    - "kl_divergence"
    - "metric_regularization"
    - "total_loss"
    
  # Sampling for evaluation
  num_samples: 16
  num_interpolations: 8

# Hardware configuration
hardware:
  device: "auto"  # auto, cuda, cpu
  mixed_precision: false
  deterministic: false
  seed: 42

# Output configuration
output:
  dir: "outputs/rhvae_sprites"
  save_metrics: true
  save_model: true
  save_visualizations: true 