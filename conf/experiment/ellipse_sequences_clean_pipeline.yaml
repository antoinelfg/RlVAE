# @package experiment

# Ultimate clean three-stage pipeline for ellipse_sequences with optimized WandB workspace
defaults:
  - rlvae_three_stage_pipeline
  - /visualization: ellipse_sequences_optimized
  - /wandb: three_stage_optimized

type: three_stage
name: ellipse_sequences_clean_pipeline
description: "Clean three-stage pipeline optimized for ellipse_sequences with 2D latent space and organized WandB logging"

# Override key settings for clean workspace
run_stage_a: true
run_stage_b: true
run_sampling: true
run_stage_c: true

# Optimized stage configurations
stage_a:
  model: vanilla_vae
  epochs: 50      # Reduced from 100 for faster iteration
  batch_size: 64
  lr: 1e-4
  beta: 1.0
  architecture: mlp
  latent_dim: ${model.latent_dim}
  
  # Clean logging for Stage A
  wandb_config:
    prefix: "stageA"
    key_metrics: ["train_loss", "val_loss", "reconstruction_mse"]
    log_frequency: 5

stage_b:
  implementation: ${metric.implementation}
  n_centroids: 300
  temperature: ${metric.temperature}
  regularization: ${metric.regularization}
  centroid_method: ${metric.centroid_method}
  neighbor_mode: ${oc.select:metric.neighbor_mode,global}
  knn_k: ${oc.select:metric.knn_k,300}
  use_timestep: ${oc.select:metric.use_timestep,0}
  standardize_latents: ${oc.select:metric.standardize_latents,false}
  
  # Visualization optimized for ellipse sequences
  visuals_filter_centroids_to_t0: false
  visuals_jitter_centroids: auto
  visuals_scale_mode: percentile
  extra_temps: []
  
  # Clean logging for Stage B
  wandb_config:
    prefix: "stageB"
    key_metrics: ["metric_eigenvalues", "centroids_quality", "temperature_stability"]
    log_frequency: 10

stage_c:
  model: rhvae_original
  epochs: 30      # Reduced from 50 for faster iteration
  batch_size: 64
  riemannian_beta: ${model.riemannian_beta}
  allow_metric_updates: false
  force_rhvae_components: false
  update_metric_during_training: false
  
  # Clean logging for Stage C
  wandb_config:
    prefix: "stageC"
    key_metrics: ["riemannian_kl", "flow_loss", "total_loss", "convergence"]
    log_frequency: 3

# Enforce 2D latent space for clean visualization
model:
  latent_dim: 2
  metric:
    trainable: false
    init_from_fixed: true
    temperature_override: null

training:
  model:
    latent_dim: 2

# Clean WandB workspace configuration
wandb_optimization:
  project_name: "rlvae-ellipse-clean"
  run_name_template: "ellipse_3stage_ld2_{timestamp}"
  
  # Organized grouping
  group_by_stage: true
  use_stage_prefixes: true
  
  # Reduced logging frequency
  essential_metrics_only: true
  log_every_n_epochs: 5
  
  # Clean visualization set
  essential_visualizations:
    - "reconstruction_grid"
    - "latent_manifold_2d" 
    - "sequence_trajectories"
    - "loss_curves"
    - "metric_analysis"      # Stage B only
    - "flow_diagnostics"     # Stage C only
  
  # Disabled visualizations to reduce noise
  disabled_visualizations:
    - "interactive_3d"
    - "curvature_analysis"
    - "detailed_flow_fields"
    - "high_res_grids"
    - "system_metrics"

# Performance optimization
performance:
  reduce_memory_usage: true
  optimize_for_speed: true
  cleanup_intermediate_files: true
  
# Summary reporting
summary:
  generate_stage_summaries: true
  create_final_report: true
  include_timing_analysis: true
