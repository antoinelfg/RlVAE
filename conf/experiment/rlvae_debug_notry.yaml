# Standalone debug config - No multi-try (K=1, volume acceptance ON)
name: rlvae_debug_notry
description: "DEBUG No Multi-Try: K=1 (multi-try OFF), volume acceptance ON. Tests if multi-try causes bias."

# Override posterior sampling parameters
model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.12
    rhmc_alpha: 0.1
    rhmc_eps_reg: 1.0e-3
    sigma_normalization_mode: 'none'
    initial_target_radius: 0.0
    # No multi-try: K=1, but keep volume acceptance
    volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
    initial_n_candidates: 1
    initial_volume_tolerance: 0.05
    initial_max_retries: 3

stage_c:
  epochs: 5

wandb:
  project: rlvae-z0-investigation
  run_name_template: DEBUG_NOTRY_K1_VOL_{data.name}_ld{model.latent_dim}
  tags:
  - z0_investigation
  - no_multitry
  - multi_try_off
  - volume_acc_on

