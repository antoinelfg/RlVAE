# Enhanced KL with Metric Update Experiment Configuration
# Based on the working command structure but with enhanced KL mechanism

defaults:
  - _self_
  - model: rhvae_enhanced_kl_with_metric_update
  - data: cyclic_sprites
  - training: stable_training
  - wandb: enhanced_kl_project

hydra:
  run:
    dir: outputs/enhanced_kl_with_metric_update/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: outputs/enhanced_kl_sweep/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}

# Experiment settings
experiment:
  name: enhanced_kl_with_metric_update
  description: "Enhanced KL with metric updates during training"
  
  # Training parameters
  epochs: 50
  batch_size: 32
  
  # Enhanced KL specific settings
  enhanced_kl:
    enabled: true
    adaptive_beta: true
    ramp_up_steps: 20
    alignment_weight: 0.15
    
  # Metric update settings
  metric_update:
    enabled: true
    frequency: 30  # Update every 30 batches
    alpha: 0.01    # Gradual update rate
    
  # Visualization settings
  visualization:
    level: intermediate
    posterior_analysis: true
    metric_coverage: true
    alignment_metrics: true

# Model configuration
model:
  latent_dim: 16
  riemannian_beta: 1.0
  
  # Enhanced KL parameters
  adaptive_kl_enabled: true
  adaptive_kl_ramp_up_steps: 20
  adaptive_kl_alignment_weight: 0.15
  
  # Metric update parameters (ENABLED)
  update_metric_during_training: true
  metric_update_frequency: 30
  metric_update_alpha: 0.01
  metric_update_temperature: 0.1
  metric_update_regularization: 0.01
  
  # Pretrained components (from working command)
  pretrained:
    encoder_path: data/pretrained/encoder_diverse_mlp_ld16_20250820_112008.pt
    decoder_path: data/pretrained/decoder_diverse_mlp_ld16_20250820_112008.pt
    metric_path: data/pretrained/metric_diverse_mlp_ld16_20250820_112010.pt

# Training configuration
training:
  trainer:
    max_epochs: 50
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    
  # Optimizer settings for stability
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-3
    weight_decay: 1e-4
    
  # Learning rate scheduler for stability
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 1e-6

# Data configuration
data:
  batch_size: 32
  num_workers: 4
  pin_memory: true

# WandB configuration
wandb:
  project: rlvae-enhanced-kl-metric-update
  tags: ["enhanced_kl", "metric_update", "posterior_adaptation", "stability"]
  group: enhanced_kl_with_metric_update
  notes: "Enhanced KL with metric updates during training - posterior adaptation"
