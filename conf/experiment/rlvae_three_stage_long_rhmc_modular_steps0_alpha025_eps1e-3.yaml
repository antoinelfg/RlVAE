# @package experiment

# RHMC disabled (z0-only) with tuned posterior covariance
# Σ(μ) = α · G^{-1}(μ) + ε I
# Moderate shrinkage: α=0.25, jitter ε=1e-3

defaults:
  - rlvae_three_stage_long_rhmc_modular_steps0

model:
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 0
    rhmc_alpha: 0.25
    rhmc_eps_reg: 1e-3
  rhmc_steps: 0
  rhmc_alpha: 0.25
  rhmc_eps_reg: 1e-3
  posterior_local_alpha: 0.25

training:
  model:
    posterior:
      type: riemannian_rhmc
      rhmc_steps: 0
      rhmc_alpha: 0.25
      rhmc_eps_reg: 1e-3

