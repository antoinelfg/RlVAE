# Standalone debug config - Vanilla baseline (K=1, no volume acceptance)
name: rlvae_debug_vanilla
description: "DEBUG Vanilla: K=1, volume acceptance OFF. Pure N(mu, Sigma) sampling baseline."

# Override posterior sampling parameters for vanilla baseline
model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.12
    rhmc_alpha: 0.1
    rhmc_eps_reg: 1.0e-3
    sigma_normalization_mode: 'none'
    initial_target_radius: 0.0
    volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
    # Vanilla: Pure N(mu, Sigma) - no multi-try, no volume acceptance
    initial_n_candidates: 1
    initial_volume_tolerance: 0.0
    initial_max_retries: 0

stage_c:
  epochs: 5

wandb:
  project: rlvae-z0-investigation
  run_name_template: DEBUG_VANILLA_K1_NOVOL_{data.name}_ld{model.latent_dim}
  tags:
  - z0_investigation
  - vanilla_baseline
  - multi_try_off
  - volume_acc_off

