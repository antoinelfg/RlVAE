skip_stage1: true
# @package experiment

# Global Vanilla VAE + RLVAE Pipeline

type: "pipeline"
name: "global_vanilla_rlvae_pipeline"
description: "Full pipeline: vanilla VAE with diverse metric extraction, then RLVAE with loaded components."

# Stage 1: Vanilla VAE + Diverse Metric
stage1:
  batch_size: 64
  model: vanilla_vae
  training:
    full_data:
      batch_size: 64
  # All important parameters below always follow the top-level config (RULE)
  data: ${data}
  visualization: minimal
  extract_diverse_metric: true
  # Metric extraction parameters
  architecture: ${model.encoder.architecture}
  latent_dim: ${model.latent_dim}
  sequence_length: ${data.sequence_length}
  n_flows: ${oc.decode:${data.sequence_length} - 1}  # n_flows always sequence_length - 1
  beta: ${model.beta}
  flow_hidden_size: ${model.flow_hidden_size}
  flow_n_blocks: ${model.flow_n_blocks}
  flow_n_hidden: ${model.flow_n_hidden}
  epsilon: ${model.epsilon}
  epochs: 200
  temperature: 0.5
  regularization: 0.01
  preset: balanced
  # Metric analysis parameters
  n_heatmaps: 6  # Number of metric matrix heatmaps to show (default: 6)

# Stage 2: RLVAE (MLP, CNN, etc.)
stage2:
  batch_size: 64
  model: mlp_rlvae  # or cnn_rlvae, resnet_rlvae, etc.
  training:
    full_data:
      batch_size: 64
  # All important parameters below always follow the top-level config (RULE)
  data: ${data}
  visualization: standard
  epochs: 200
  # Pretrained components will be loaded from stage 1 outputs
  load_pretrained_from_stage1: true
  sampling:
    use_riemannian: true
  posterior:
    type: riemannian_metric
  architecture: ${model.encoder.architecture}
  latent_dim: ${model.latent_dim}
  sequence_length: ${data.sequence_length}
  n_flows: 5
  beta: ${model.beta}
  flow_hidden_size: ${model.flow_hidden_size}
  flow_n_blocks: ${model.flow_n_blocks}
  flow_n_hidden: ${model.flow_n_hidden}
  epsilon: ${model.epsilon}
  riemannian_beta: 200
  metric:
    metric_reg_weight: 0.0

# Logging
log_level: "INFO"
log_to_file: true

deterministic: true
benchmark: false

visualization:
  sequence_viz_count: 64         # Number of sequences to plot (int or "all")
  cluster_sequences: true        # Whether to cluster sequences
  n_clusters: 5                  # Number of clusters (if clustering enabled)
  cluster_coloring: true         # Use cluster colors in plots
  show_cluster_centroids: true   # Optionally plot centroids

batch_size: 64 