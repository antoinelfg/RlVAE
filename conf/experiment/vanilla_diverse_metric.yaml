# @package experiment

# Vanilla VAE + Diverse Metric Extraction

type: "single"
name: "vanilla_diverse_metric"
description: "Train vanilla VAE and extract diverse metric for downstream RLVAE."

# Model and training configs
model: vanilla_vae
training: full_data
data: cyclic_sprites
visualization: minimal

# Metric extraction flag (if supported by runner)
extract_diverse_metric: true

# Logging
log_level: "INFO"
log_to_file: true

# Reproducibility
deterministic: true
benchmark: false 