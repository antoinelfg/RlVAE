# @package experiment

type: single
name: rlvae_trainable_metric_maxdiv

defaults:
  - /model/mlp_rlvae_trainable_metric

pretrained:
  encoder_path: data/pretrained/encoder_diverse_mlp_ld16_20250717_134643.pt
  decoder_path: data/pretrained/decoder_diverse_mlp_ld16_20250717_134643.pt
  metric_path: data/pretrained/metric_diverse_mlp_ld16_20250717_134647.pt

metric:
  trainable: true
  architecture: resnet
  arch_kwargs:
    hidden_dim: 256
    n_blocks: 6
  init_from_fixed: false
  metric_reg_weight: 0.05
  metric_reg_type: smoothness
  metric_reg_target: 0.0

training:
  optimizer:
    lr: 1e-3
    weight_decay: 1e-5
  epochs: 100

visualization:
  level: minimal
  frequency: 10
  enable_basic: true
  enable_manifold: false
  enable_interactive: false
  enable_flow_analysis: false
  basic_frequency: 10
  manifold_frequency: 0
  interactive_frequency: 0
  flow_frequency: 0
  disable_curvature: true
  enable_fancy_plots: false
  save_local: true
  log_to_wandb: true 