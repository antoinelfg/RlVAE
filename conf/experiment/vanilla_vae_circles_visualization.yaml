# @package experiment

# Vanilla VAE on Colored Circles with Reconstruction and Latent Space Visualization

type: "single"
name: "vanilla_vae_circles_visualization"
description: "Vanilla VAE (MLP, ld=2) on colored circles with reconstruction vs original + latent space visualization"

# Model configuration
model: vanilla_vae
architecture: mlp
latent_dim: 2

# Data configuration
data: colored_circles
sequence_length: 10

# Training configuration
training:
  full_data:
    batch_size: 64
  epochs: 50
  learning_rate: 1e-3
  weight_decay: 1e-5

# Visualization configuration
visualization:
  level: "full"
  frequency: 1
  enable_basic: true
  enable_manifold: true
  enable_interactive: false
  enable_flow_analysis: false
  basic_frequency: 1
  manifold_frequency: 1
  max_sequences: 16
  enable_fancy_plots: true
  save_local: true
  log_to_wandb: true

# Logging
log_level: "INFO"
log_to_file: true

deterministic: true
benchmark: false

# Custom visualization settings for reconstruction comparison
custom_viz:
  reconstruction_comparison: true
  latent_space_visualization: true
  n_samples: 32
  save_reconstruction_grid: true
  save_latent_scatter: true 