# @package experiment

# Long training configuration - Standard posterior with ModRLVAE
defaults:
  - rlvae_three_stage_pipeline

type: three_stage
name: rlvae_three_stage_long_standard_modular
description: "Long training with Modular RLVAE and standard riemannian_metric posterior (200 epochs A&C)"

# Extended training configuration
stage_a:
  model: vanilla_vae
  epochs: 200              # Extended from 50
  batch_size: 64
  lr: 1e-4
  beta: 1.0
  architecture: mlp
  latent_dim: 2

stage_b:
  implementation: rhvae
  n_centroids: 300
  temperature: 0.7
  regularization: 0.01
  centroid_method: kmedoids
  neighbor_mode: global
  knn_k: 300

stage_c:
  model: modular_rlvae      # Use modular RLVAE instead of rhvae_original
  epochs: 200              # Extended from 30
  batch_size: 64
  riemannian_beta: 8.0
  allow_metric_updates: false
  force_rhvae_components: false
  update_metric_during_training: false

# Model configuration (standard posterior)
model:
  latent_dim: 2
  posterior:
    type: "riemannian_metric"  # Standard Riemannian posterior (no RHMC)
  metric:
    trainable: false             # Keep metric frozen
    init_from_fixed: true
    temperature_override: null
  # Additional ModRLVAE config
  posterior_type: "riemannian_metric"
  kl_use_metric_normalization: true
  kl_metric_norm_mode: "geomean"
  use_curvature_correction: true

training:
  model:
    latent_dim: 2
    posterior:
      type: riemannian_metric
    posterior_type: riemannian_metric

# WandB configuration
wandb:
  project: rlvae-rhmc-comparison-long
  run_name_template: "STANDARD_MOD_200ep_{experiment.name}_{data.name}_ld{model.latent_dim}"
  tags: ["long_training", "standard_posterior", "200_epochs", "modular_rlvae"]

