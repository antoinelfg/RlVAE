# @package experiment

type: single
name: rlvae_trainable_metric
description: "Train RLVAE with trainable metric and optional alternating metric updates."

# Use default cyclic sprites data unless overridden
data: cyclic_sprites

model: mlp_rlvae_trainable_metric

# Pretrained (fill or override via CLI)
pretrained:
  encoder_path: data/pretrained/encoder_diverse_mlp_ld16_20250717_134643.pt
  decoder_path: data/pretrained/decoder_diverse_mlp_ld16_20250717_134643.pt
  metric_path: data/pretrained/metric_diverse_mlp_ld16_20250717_134647.pt

# Metric is trainable with init from fixed
metric:
  trainable: true
  architecture: resnet
  arch_kwargs:
    hidden_dim: 128
    n_blocks: 4
  init_from_fixed: true
  fixed_metric_path: data/pretrained/metric_diverse_mlp_ld16_20250717_134647.pt
  metric_reg_weight: 1.0
  metric_reg_type: condition
  metric_reg_target: 10.0

# Riemannian posterior/prior
posterior:
  type: riemannian_metric
sampling:
  use_riemannian: true
  method: geodesic

training:
  optimizer:
    lr: 1e-3
    weight_decay: 1e-5
  # epochs delegated to default; can override here if needed
  metric_alternation:
    enabled: true
    warmup_epochs: 5
    k_rlvae_epochs: 3
    metric_step_epochs: 1
    anchor_size: 20000
    anchor_refresh_frac: 0.1
    logdet_clip: 50.0
    consistency_weight: 0.0