# Alpha sweep: α = 10.0 (very large)
name: rlvae_debug_alpha_10p0
description: "Alpha sweep: α=10.0. Tests extreme large covariance to maximize exploration range."

model:
  latent_dim: 2
  posterior:
    type: riemannian_rhmc
    rhmc_steps: 4
    rhmc_step_size: 0.12
    rhmc_alpha: 10.0  # Very large alpha - maximum exploration
    rhmc_eps_reg: 1.0e-3
    sigma_normalization_mode: 'none'
    initial_target_radius: 0.0
    # Vanilla: no selection bias
    volume_force_sign: 1.0  # FIXED: +1.0 to move TOWARD high volume regions
    initial_n_candidates: 1
    initial_volume_tolerance: 0.0
    initial_max_retries: 0

stage_c:
  epochs: 5

wandb:
  project: rlvae-alpha-sweep
  run_name_template: ALPHA_10p0_{data.name}_ld{model.latent_dim}
  tags:
  - alpha_sweep
  - alpha_10p0
  - spatial_mismatch_test

