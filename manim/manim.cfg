[CLI]
# Disable video output completely
write_to_movie = False
save_last_frame = True
save_pngs = False
format = png

# Quality settings
quality = h
frame_rate = 30
pixel_height = 1080
pixel_width = 1920

# Renderer
renderer = cairo

# Media directory
media_dir = ./media
video_dir = {media_dir}/videos
images_dir = {media_dir}/images

# Disable caching to avoid issues
disable_caching = True
flush_cache = True

# Background
background_color = #0d1117
background_opacity = 1
